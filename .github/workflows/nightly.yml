name: Nightly ingestion

on:
  schedule:
    # 02:00 UTC, Monday–Friday (spec §9)
    - cron: '0 2 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm job:nightly
        env:
          # Supabase session pooler URL (port 5432) — migrations + ingestion
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          BLS_KEY: ${{ secrets.BLS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_FROM: ${{ secrets.ALERTS_FROM }}
